services:
  mysql:
    image: mysql:9.7.2
    container_name: bd2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bd2_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
      MYSQL_USER: ${MYSQL_USER:-bd2}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bd2}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - bd2_mysql_data:/var/lib/mysql
      - ./material/catedra/practica/recursos/esq_peliculas.sql:/docker-entrypoint-initdb.d/10-esq-peliculas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo:
    # 8.0+ no arranca en kernels Linux 6.19+ (SERVER-121912); la serie 7.0 no usa
    # el tcmalloc afectado. Ver wiki/dudas-y-conflictos.md.
    image: mongo:7.0.43
    container_name: bd2-mongo
    restart: unless-stopped
    # Sin autenticación: solo se publica en localhost.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - bd2_mongo_data:/data/db
      # Datasets del TP 9 visibles en el contenedor, sin docker cp.
      - ./material/catedra/practica/recursos:/recursos:ro
      - ./practica:/practica:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  cassandra:
    # La guía usa `cassandra` sin etiqueta; se fija la última 5.0 estable.
    image: cassandra:5.0.9
    container_name: bd2-cassandra
    restart: unless-stopped
    environment:
      # Un solo nodo de laboratorio: se acota el heap de la JVM.
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    # Sin autenticación: solo se publica en localhost.
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - bd2_cassandra_data:/var/lib/cassandra
      - ./practica:/practica:ro
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  bd2_mysql_data:
  bd2_mongo_data:
  bd2_cassandra_data:
