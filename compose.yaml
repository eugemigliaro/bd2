services:
  mysql:
    image: mysql:9.7.1
    container_name: bd2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bd2_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
      MYSQL_USER: ${MYSQL_USER:-bd2}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bd2}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - bd2_mysql_data:/var/lib/mysql
      - ./material/catedra/practica/recursos/esq_peliculas.sql:/docker-entrypoint-initdb.d/10-esq-peliculas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  bd2_mysql_data:
