<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="flecha-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="white"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" fill="#0f172a">TP 8 — Ejercicio 1.a — grafo de autorización sobre PARRAFO (teoría)</text>

  <!-- db_exp -> adm -->
  <path d="M185,165 Q285,75 385,165" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="285" y="108" text-anchor="middle" font-size="13" fill="#0f172a">SELECT (WGO)</text>
  <path d="M187,190 L383,190" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="285" y="182" text-anchor="middle" font-size="13" fill="#0f172a">UPDATE (WGO)</text>
  <path d="M185,215 Q285,305 385,215" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="285" y="278" text-anchor="middle" font-size="13" fill="#0f172a">DELETE</text>

  <!-- adm -> doc -->
  <path d="M515,165 Q615,75 715,165" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="615" y="108" text-anchor="middle" font-size="13" fill="#0f172a">SELECT</text>
  <path d="M517,190 L713,190" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="615" y="166" text-anchor="middle" font-size="12" fill="#0f172a">UPDATE(tiempo, diccion)</text>
  <text x="615" y="182" text-anchor="middle" font-size="12" fill="#0f172a">(WGO)</text>
  <path d="M515,215 Q615,305 715,215" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#flecha-error)"/>
  <line x1="605" y1="250" x2="625" y2="270" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="625" y1="250" x2="605" y2="270" stroke="#dc2626" stroke-width="2.5"/>
  <text x="615" y="292" text-anchor="middle" font-size="13" fill="#dc2626">DELETE — error: adm no tiene WGO</text>

  <!-- nodos -->
  <ellipse cx="120" cy="190" rx="65" ry="35" fill="#dbeafe" stroke="#334155" stroke-width="1.4"/>
  <text x="120" y="195" text-anchor="middle" font-size="15" fill="#0f172a">db_exp</text>
  <text x="120" y="245" text-anchor="middle" font-size="12" fill="#475569">owner</text>
  <ellipse cx="450" cy="190" rx="65" ry="35" fill="#dcfce7" stroke="#334155" stroke-width="1.4"/>
  <text x="450" y="195" text-anchor="middle" font-size="15" fill="#0f172a">adm</text>
  <ellipse cx="780" cy="190" rx="65" ry="35" fill="#fef3c7" stroke="#334155" stroke-width="1.4"/>
  <text x="780" y="195" text-anchor="middle" font-size="15" fill="#0f172a">doc</text>

  <!-- leyenda -->
  <line x1="250" y1="345" x2="290" y2="345" stroke="#475569" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="298" y="349" font-size="12" fill="#334155">concesión efectiva (una arista por GRANT)</text>
  <line x1="560" y1="345" x2="600" y2="345" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#flecha-error)"/>
  <text x="608" y="349" font-size="12" fill="#334155">rechazada: no crea arista</text>
</svg>
